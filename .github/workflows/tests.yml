name: Screener tests

on:
  push:
    branches: [main]
    paths:
      - "screener/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "P1_REFERENCE.txt"
  pull_request:
    paths:
      - "screener/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "P1_REFERENCE.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q screener tests
      - name: Run test suite
        run: python -m pytest -q
