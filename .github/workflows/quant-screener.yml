name: Quant Screener Engine

on:
  repository_dispatch:
    types: [run_quant_engine]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-screener-run
  cancel-in-progress: false

jobs:
  run-screener:
    name: Execute 5-Min Quant Screener
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOP_N_SYMBOLS: "100"
      SCAN_CONCURRENCY: "25"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      SIGNAL_HISTORY_BARS: "60"
      SIGNAL_Z_MIN_SAMPLES: "24"
      BETA_MIN_SAMPLES: "24"
      ATR_LOOKBACK_BARS: "12"
      ATR_STOP_MULTIPLIER: "1.50"
      MAX_ATR_MULTIPLIER: "2.50"
      MAX_PORTFOLIO_CORRELATION: "0.80"
      MAX_AGGREGATE_RISK_PCT: "0.03"
      MAX_GROSS_LEVERAGE: "3.0"
      FUNDING_PROXIMITY_MINUTES: "20"
      FUNDING_EXTREME_THRESHOLD_8H: "0.0010"
      OBI_DECAY: "0.85"
      MAX_DRAWDOWN_PCT: "0.20"
      DAILY_LOSS_LIMIT_PCT: "0.08"
      MAX_EQUITY_STATE_AGE_SEC: "600"
      RISK_PER_TRADE_PCT: "0.01"
      MAX_LEVERAGE: "3"
      PAPER_TRADING: "1"
      SWEEP_BOOSTER_POINTS: "0.0"
      BINANCE_MAX_REQUEST_RETRIES: "3"
      BINANCE_RETRY_BACKOFF_CAP_SEC: "8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${BINANCE_API_KEY:-}"
          test -n "${TG_BOT_TOKEN:-}"
          test -n "${TG_CHAT_IDS:-}"
          test -n "${{ secrets.WIREGUARD_CONF }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Codebase syntax verification
        run: python -m compileall -q .

      - name: Execute pytest test suite
        run: python -m pytest -q

      - name: Connect WireGuard VPN (Proton Netherlands)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y wireguard resolvconf
          echo "${{ secrets.WIREGUARD_CONF }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0
          echo "=== Active Outbound IP via VPN ==="
          curl -s --max-time 10 https://ipinfo.io/json | grep -E "ip|country|city|org" || true

      - name: Run 5-Minute Quant Screener
        run: python cron_runner.py

      - name: Disconnect WireGuard VPN
        if: always()
        run: |
          sudo wg-quick down wg0 2>/dev/null || true

      - name: Persist runtime state & research artifacts
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Авторизация через x-access-token
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Persist only intentional runtime/research artifacts. SQLite is ignored
          # because the durable cross-run dataset is stored in hourly JSONL shards.
          git add data/
          # Удаляем старые файлы из корня репозитория (если они были созданы ранее)
          git rm -f .market_state.bin .signals_latest.json .alert_cache.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore(state): persist quant runtime state [skip ci]"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "State snapshot committed successfully."
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 2))
          done

          echo "ERROR: Could not push state changes after all retries." >&2
          exit 1
