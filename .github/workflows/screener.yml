name: Screener

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyse without Telegram delivery
        type: boolean
        required: false
        default: true
  repository_dispatch:
    types: [run_screener]

permissions:
  contents: write

concurrency:
  group: screener
  # Cron-job.org dispatches every five minutes. Let the active scan finish,
  # while keeping only the newest pending poll to avoid stale-run backlogs.
  queue: single
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BINANCE_BASE_URL: https://fapi.binance.com
      BINANCE_VPN_ENABLED: "true"
      BINANCE_HTTP_PROXY: http://127.0.0.1:18080
      BINANCE_REQUEST_INTERVAL_SEC: "0.12"
      DATA_DIR: data
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      # Hosted runners are fresh. Cache pip downloads, the actual Chromium bundle,
      # and the checksum-pinned WireProxy archive between workflow executions.
      - name: Cache Python packages, Playwright browser and WireProxy
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.cache/wireproxy
          key: screener-${{ runner.os }}-ubuntu-24.04-py3.11-${{ hashFiles('requirements.txt') }}-chromium-wireproxy-v1.1.3
          restore-keys: |
            screener-${{ runner.os }}-ubuntu-24.04-py3.11-

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          mkdir -p data

      - name: Install Playwright Chromium on cache miss
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Reuse cached Playwright Chromium
        if: steps.cache-runtime.outputs.cache-hit == 'true'
        run: echo "Playwright Chromium cache hit; browser download skipped."

      - name: Verify Playwright Chromium launch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              try:
                  page = browser.new_page()
                  page.set_content("<html><body><main>chromium-ready</main></body></html>")
                  actual = page.locator("main").inner_text()
                  if actual != "chromium-ready":
                      raise RuntimeError(f"Unexpected Chromium smoke-test result: {actual!r}")
              finally:
                  browser.close()
          print("Playwright Chromium launch and page-render smoke test: OK")
          PY

      - name: Install checksum-pinned WireProxy
        shell: bash
        env:
          WIREPROXY_VERSION: v1.1.3
          WIREPROXY_URL: https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          WIREPROXY_SHA256: e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/wireproxy"
          bin_dir="$HOME/.local/bin"
          mkdir -p "$cache_dir" "$bin_dir"
          archive="$cache_dir/wireproxy_linux_amd64.tar.gz"
          if [[ ! -s "$archive" ]] || [[ "$(sha256sum "$archive" | awk '{print $1}')" != "$WIREPROXY_SHA256" ]]; then
            curl --fail --silent --show-error --location "$WIREPROXY_URL" -o "$archive"
          fi
          echo "$WIREPROXY_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$cache_dir"
          test -f "$cache_dir/wireproxy"
          install -m 0755 "$cache_dir/wireproxy" "$bin_dir/wireproxy"
          "$bin_dir/wireproxy" --version

      - name: Start Binance-only WireGuard proxy
        shell: bash
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${WIREGUARD_CONF:-}" ]]; then
            echo "::error::Missing GitHub Secret WIREGUARD_CONF."
            exit 1
          fi
          vpn_dir="$(mktemp -d)"
          echo "VPN_DIR=$vpn_dir" >> "$GITHUB_ENV"
          wg_conf="$vpn_dir/wg.conf"
          proxy_conf="$vpn_dir/wireproxy.conf"
          printf '%s\n' "$WIREGUARD_CONF" > "$wg_conf"
          chmod 600 "$wg_conf"

          # Validate key fields locally without echoing any secret values to Actions logs.
          python - "$wg_conf" <<'PY'
          import base64
          import binascii
          import sys
          from pathlib import Path

          sections = {}
          current = None
          for raw_line in Path(sys.argv[1]).read_text(encoding="utf-8-sig").splitlines():
              line = raw_line.strip()
              if not line or line.startswith(("#", ";")):
                  continue
              if line.startswith("[") and line.endswith("]"):
                  current = line[1:-1].strip().lower()
                  sections.setdefault(current, {})
              elif current and "=" in line:
                  key, value = line.split("=", 1)
                  sections[current][key.strip().lower()] = value.strip()

          required = (("interface", "privatekey"), ("peer", "publickey"))
          for section, key in required:
              if key not in sections.get(section, {}):
                  raise SystemExit(f"Invalid WireGuard config: missing [{section.title()}] {key}.")
          keys = list(required)
          if "presharedkey" in sections.get("peer", {}):
              keys.append(("peer", "presharedkey"))
          for section, key in keys:
              try:
                  decoded = base64.b64decode(sections[section][key], validate=True)
              except (ValueError, binascii.Error):
                  raise SystemExit(f"Invalid WireGuard config: [{section.title()}] {key} is not valid Base64.")
              if len(decoded) != 32:
                  raise SystemExit(f"Invalid WireGuard config: [{section.title()}] {key} must decode to 32 bytes.")
          print("WireGuard key fields: valid Base64 and 32-byte length.")
          PY

          cat > "$proxy_conf" <<EOF2
          WGConfig = $wg_conf

          [http]
          BindAddress = 127.0.0.1:18080
          EOF2
          chmod 600 "$proxy_conf"
          "$HOME/.local/bin/wireproxy" --configtest -c "$proxy_conf"
          "$HOME/.local/bin/wireproxy" -c "$proxy_conf" >"$vpn_dir/wireproxy.log" 2>&1 &
          echo $! > "$vpn_dir/wireproxy.pid"

          # Test the destination actually used by the application. Do not route
          # third-party IP-check services through the Binance-only proxy.
          probe_ok=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --noproxy "" \
              --proxy "$BINANCE_HTTP_PROXY" --connect-timeout 3 --max-time 8 \
              https://fapi.binance.com/fapi/v1/ping \
              -o "$vpn_dir/binance-ping.json" 2>"$vpn_dir/binance-probe.log"; then
              probe_ok=true
              break
            fi
            sleep 1
          done
          if [[ "$probe_ok" != "true" || ! -s "$vpn_dir/binance-ping.json" ]]; then
            echo "::error::Binance API is not reachable through WireProxy."
            cat "$vpn_dir/binance-probe.log" || true
            cat "$vpn_dir/wireproxy.log" || true
            exit 1
          fi
          echo "Binance API connectivity through WireProxy: OK"

      - name: Analyse Coinalyze table and notify Telegram
        shell: bash
        env:
          COINALYZE_URL: ${{ secrets.COINALYZE_URL }}
          COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
          COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: |
          set -euo pipefail
          for secret_name in COINALYZE_URL COINALYZE_P_SID COINALYZE_CHAT_SID; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub Secret ${secret_name}."
              exit 1
            fi
          done
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            export DRY_RUN=true
          else
            export DRY_RUN=false
          fi
          if [[ "$DRY_RUN" == "false" ]]; then
            if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_IDS:-}" ]]; then
              echo "::error::Live delivery requires TG_BOT_TOKEN and TG_CHAT_IDS."
              exit 1
            fi
          fi
          python -m screener

      - name: Stop Binance-only WireProxy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VPN_DIR:-}" && -f "$VPN_DIR/wireproxy.pid" ]]; then
            pid="$(cat "$VPN_DIR/wireproxy.pid" || true)"
            if [[ -n "$pid" ]]; then
              kill "$pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 10); do
                if ! kill -0 "$pid" >/dev/null 2>&1; then break; fi
                sleep 1
              done
              kill -9 "$pid" >/dev/null 2>&1 || true
            fi
            rm -rf "$VPN_DIR"
          fi

      - name: Persist JSONL history on the current branch
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::State persistence requires a branch ref; got $GITHUB_REF"
            exit 1
          fi
          mkdir -p data
          touch data/snapshots.jsonl data/market_rows.jsonl data/notifications.jsonl data/runs.jsonl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # runs.jsonl is invocation diagnostics, not cross-run strategy state.
          # Do not create a Git commit on every poll just because a run completed.
          if git ls-files --error-unmatch data/runs.jsonl >/dev/null 2>&1; then
            git rm --cached -f data/runs.jsonl
          fi
          git add data/snapshots.jsonl data/market_rows.jsonl data/notifications.jsonl
          if git diff --cached --quiet; then
            echo "No JSONL state changes to commit"
            exit 0
          fi
          git commit -m "Persist screener JSONL history [skip ci]"
          git push origin "HEAD:${GITHUB_REF}"
          echo "Persisted JSONL history on ${GITHUB_REF}"
