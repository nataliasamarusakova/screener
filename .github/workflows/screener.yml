name: Screener

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyse without Telegram delivery
        type: boolean
        required: false
        default: true
  repository_dispatch:
    types: [run_screener]

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BINANCE_BASE_URL: https://fapi.binance.com
      BINANCE_VPN_ENABLED: "true"
      BINANCE_HTTP_PROXY: http://127.0.0.1:18080
      BINANCE_REQUEST_INTERVAL_SEC: "0.12"
      DATA_DIR: data
      OUTPUT_DIR: reports
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p data reports

      - name: Test analysis modules
        run: python -m pytest -q

      - name: Install WireProxy
        shell: bash
        env:
          WIREPROXY_URL: https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          WIREPROXY_SHA256: e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/wireproxy"
          bin_dir="$HOME/.local/bin"
          mkdir -p "$cache_dir" "$bin_dir"
          archive="$cache_dir/wireproxy_linux_amd64.tar.gz"
          if [[ ! -s "$archive" ]] || [[ "$(sha256sum "$archive" | awk '{print $1}')" != "$WIREPROXY_SHA256" ]]; then
            curl --fail --silent --show-error --location "$WIREPROXY_URL" -o "$archive"
          fi
          echo "$WIREPROXY_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$cache_dir"
          test -f "$cache_dir/wireproxy"
          install -m 0755 "$cache_dir/wireproxy" "$bin_dir/wireproxy"
          "$bin_dir/wireproxy" --version

      - name: Start Binance-only WireGuard proxy
        shell: bash
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
          VPN_EXPECTED_COUNTRY: NL
        run: |
          set -euo pipefail
          if [[ -z "${WIREGUARD_CONF:-}" ]]; then
            echo "::error::Missing GitHub Secret WIREGUARD_CONF."
            exit 1
          fi
          vpn_dir="$(mktemp -d)"
          echo "VPN_DIR=$vpn_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$WIREGUARD_CONF" > "$vpn_dir/wg.conf"
          chmod 600 "$vpn_dir/wg.conf"
          # Validate key material without ever printing key values to Actions logs.
          python - "$vpn_dir/wg.conf" <<'PY'
          import base64
          import binascii
          import sys
          from pathlib import Path

          sections = {}
          current = None
          for raw_line in Path(sys.argv[1]).read_text(encoding="utf-8-sig").splitlines():
              line = raw_line.strip()
              if not line or line.startswith(("#", ";")):
                  continue
              if line.startswith("[") and line.endswith("]"):
                  current = line[1:-1].strip().lower()
                  sections.setdefault(current, {})
                  continue
              if current and "=" in line:
                  key, value = line.split("=", 1)
                  sections[current][key.strip().lower()] = value.strip()

          required = (("interface", "privatekey"), ("peer", "publickey"))
          for section, key in required:
              if key not in sections.get(section, {}):
                  raise SystemExit(f"Invalid WireGuard config: missing [{section.title()}] {key}.")
          keys = list(required)
          if "presharedkey" in sections.get("peer", {}):
              keys.append(("peer", "presharedkey"))
          for section, key in keys:
              value = sections[section][key]
              try:
                  decoded = base64.b64decode(value, validate=True)
              except (ValueError, binascii.Error):
                  raise SystemExit(f"Invalid WireGuard config: [{section.title()}] {key} is not valid Base64.")
              if len(decoded) != 32:
                  raise SystemExit(f"Invalid WireGuard config: [{section.title()}] {key} must decode to 32 bytes.")
          print("WireGuard key fields: valid Base64 and 32-byte length.")
          PY
          cat > "$vpn_dir/wireproxy.conf" <<EOF2
          WGConfig = $vpn_dir/wg.conf

          [http]
          BindAddress = 127.0.0.1:18080
          EOF2
          chmod 600 "$vpn_dir/wireproxy.conf"
          if ! "$HOME/.local/bin/wireproxy" --configtest -c "$vpn_dir/wireproxy.conf" >/dev/null 2>&1; then
            echo "::error::wireproxy rejected the WireGuard configuration. Key material passed the Base64 check; verify Address, DNS, Endpoint, AllowedIPs and configuration syntax. Raw parser output is suppressed to protect keys."
            exit 1
          fi
          "$HOME/.local/bin/wireproxy" -c "$vpn_dir/wireproxy.conf" >"$vpn_dir/wireproxy.log" 2>&1 &
          echo $! > "$vpn_dir/wireproxy.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --noproxy "" \
              --proxy http://127.0.0.1:18080 --connect-timeout 3 --max-time 8 \
              https://ipinfo.io/json -o "$vpn_dir/ipinfo.json"; then
              break
            fi
            sleep 1
          done
          if [[ ! -s "$vpn_dir/ipinfo.json" ]]; then
            echo "::error::WireGuard proxy did not become ready."
            cat "$vpn_dir/wireproxy.log" || true
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["VPN_DIR"]) / "ipinfo.json"
          data = json.loads(path.read_text())
          actual = str(data.get("country", "")).upper()
          expected = os.environ["VPN_EXPECTED_COUNTRY"]
          print(f"Binance egress country: {actual or 'unknown'}")
          if actual != expected:
              raise SystemExit(f"WireGuard country mismatch: expected {expected}, got {actual}")
          PY

      - name: Analyse Coinalyze table and notify Telegram
        shell: bash
        env:
          COINALYZE_URL: ${{ secrets.COINALYZE_URL }}
          COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
          COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: |
          set -euo pipefail
          for secret_name in COINALYZE_URL COINALYZE_P_SID COINALYZE_CHAT_SID; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub Secret ${secret_name}."
              exit 1
            fi
          done
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            export DRY_RUN=true
          else
            export DRY_RUN=false
          fi
          if [[ "$DRY_RUN" == "false" ]]; then
            if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_IDS:-}" ]]; then
              echo "::error::Live delivery requires TG_BOT_TOKEN and TG_CHAT_IDS."
              exit 1
            fi
          fi
          python -m screener

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-report-${{ github.run_id }}
          path: |
            reports/screener_report.md
            reports/candidates.csv
            reports/analysis.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist JSONL history on the current branch
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::State persistence requires a branch ref; got $GITHUB_REF"
            exit 1
          fi
          mkdir -p data
          touch data/snapshots.jsonl data/market_rows.jsonl data/notifications.jsonl data/runs.jsonl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots.jsonl data/market_rows.jsonl data/notifications.jsonl data/runs.jsonl
          if git diff --cached --quiet; then
            echo "No JSONL state changes to commit"
            exit 0
          fi
          git commit -m "Persist screener JSONL history [skip ci]"
          git push origin "HEAD:${GITHUB_REF}"
          echo "Persisted JSONL history on ${GITHUB_REF}"
